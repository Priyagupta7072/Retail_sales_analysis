<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Retail Sales Analysis{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="layout">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div>

            <!-- Logo -->

            <div class="logo">

                <div class="logo-icon">

                    <i class="fa-solid fa-chart-line"></i>

                </div>

                <div>

                    <h2>Retail Analytics</h2>

                    <span>Dashboard</span>

                </div>

            </div>
            

            <!-- Menu -->

           <ul class="menu">

             <li class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
            <a href="{{ url_for('dashboard') }}">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
    </li>

    <li>
             <a href="{{ url_for('dashboard') }}#upload-section">
            <i class="fa-solid fa-upload"></i>
            <span>Upload Dataset</span>
        </a>
    </li>

    <li class="{% if request.endpoint == 'analytics' %}active{% endif %}">
        <a href="{{ url_for('analytics') }}">
            <i class="fa-solid fa-chart-column"></i>
            <span>Analytics</span>
        </a>
    </li>

    <li class="{% if request.endpoint == 'reports' %}active{% endif %}">
        <a href="{{ url_for('reports') }}">
            <i class="fa-solid fa-file-lines"></i>
            <span>Reports</span>
        </a>
    </li>

</ul>
        </div>

        <!-- Profile -->

        <div class="profile-card">

            <div class="avatar">

                PG

            </div>

            <div>

                <h4>Priya Gupta</h4>

                <p>Data Analyst</p>

            </div>

        </div>

    </aside>

    <!-- ================= Main ================= -->

    <main class="main">

        <!-- Topbar -->

        <header class="topbar">

            <div>

                <h2>{% block page_title %}Overview{% endblock %}</h2>

                <small>Retail Sales Analysis Dashboard</small>

            </div>

            <div class="top-actions">

                <!-- Search -->

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Search reports, customers, products...">

                </div>

                <!-- Date -->

                <div class="date-box">

                    <i class="fa-regular fa-calendar"></i>

                    <span id="currentDate"></span>

                </div>

                <!-- Notification -->

                <button class="icon-btn">

                    <i class="fa-regular fa-bell"></i>

                </button>

                <!-- User -->

                <button class="icon-btn">

                    <i class="fa-solid fa-user"></i>

                </button>

            </div>

        </header>

        <!-- Dynamic Content -->

        <section class="page-content">

            {% block content %}

            {% endblock %}

        </section>

    </main>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Date -->

<script>

const options = {

    day: "2-digit",
    month: "short",
    year: "numeric"

};

document.getElementById("currentDate").innerHTML =
new Date().toLocaleDateString("en-GB", options);

</script>

</body>

</html>

<li>
    <a href="#">
        <i class="fa-solid fa-upload"></i>
        <span>Upload Dataset</span>
    </a>
</li>

<li>
    <a href="{{ url_for('analytics') }}">
        <i class="fa-solid fa-chart-column"></i>
        <span>Analytics</span>
    </a>
</li>

<li>
    <a href="#">
        <i class="fa-solid fa-file-lines"></i>
        <span>Reports</span>
    </a>
</li>

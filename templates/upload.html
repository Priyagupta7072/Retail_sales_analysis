{% extends "base.html" %}

{% block title %}Import Dataset{% endblock %}

{% block page_title %}Import Dataset{% endblock %}

{% block content %}

<div class="upload-container">

    <div class="upload-card">

        <div class="upload-icon">
            <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>

        <h2>Import Your Dataset</h2>

        <p>
            Upload a CSV or Excel file to generate analytics automatically.
        </p>

        <form method="POST" enctype="multipart/form-data"></form>

            <input
              type="file"
              name="dataset"
              class="form-control"
              accept=".csv,.xlsx"
              required>

            <button class="upload-btn-main">

                <i class="fa-solid fa-upload"></i>

                Upload Dataset

            </button>

        </form>

    </div>

</div>

{% endblock %}
